<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAE Results Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --graphite-900:#0d1216; --graphite-800:#121a20; --graphite-700:#18222a;
  --graphite-600:#1e2a34; --line:#27353f; --line-soft:#1f2b34;
  --ink:#dbe4ea; --ink-2:#9fb0bc; --ink-3:#6e808d;
  --accent:#4c82d9; --accent-soft:rgba(76,130,217,.16); --accent-line:#3c6cbb;
  --pass:#4f9d74; --warn:#d68b32; --crit:#cf5450; --info:#5f92ad; --neutral:#7a8c98;
  --bg:var(--graphite-900); --surface:var(--graphite-800); --panel:var(--graphite-700);
  --raise:var(--graphite-600);
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --rail:212px; --lw:250px; --rw:296px; --bh:200px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef1f4; --surface:#f7f9fb; --panel:#ffffff; --raise:#eaeff3;
  --line:#ccd6de; --line-soft:#dde4ea;
  --ink:#16222b; --ink-2:#4c5d6a; --ink-3:#778894;
  --accent:#2b5fb8; --accent-soft:rgba(43,95,184,.12); --accent-line:#2b5fb8;
  --pass:#2f7a55; --warn:#a9631a; --crit:#b13c38; --info:#3c6f8c;
  --shadow:0 6px 22px rgba(24,40,55,.14);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 13px/1.45 var(--sans); -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.num,code,kbd{font-family:var(--mono); font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:content-box;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- app frame ---------- */
.app{height:100%; display:grid; grid-template-rows:46px 1fr 24px}
.cmdbar{
  display:flex; align-items:center; gap:14px; padding:0 12px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;padding-right:12px;border-right:1px solid var(--line);height:100%}
.brand svg{display:block}
.brand b{font-weight:600;letter-spacing:.2px;font-size:13.5px}
.brand span{color:var(--ink-3);font-family:var(--mono);font-size:10.5px}
.cmd-actions{display:flex;gap:2px;flex-wrap:wrap}
.cmd{padding:5px 10px;border-radius:4px;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.cmd:hover{background:var(--raise);color:var(--ink)}
.cmd.on{background:var(--accent-soft);color:var(--ink)}
.cmd-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ctx{
  display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel);font-size:12px;max-width:44vw
}
.ctx .dot{width:6px;height:6px;border-radius:50%;background:var(--pass);flex:none}
.ctx b{font-weight:500}
.ctx i{font-style:normal;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.iconbtn{width:30px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--ink-2)}
.iconbtn:hover{background:var(--raise);color:var(--ink)}

.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0}
.shell.collapsed{--rail:52px}

/* ---------- rail ---------- */
.rail{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:8px 0 20px}
.rail-group{padding:12px 14px 5px;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;font-family:var(--mono)}
.shell.collapsed .rail-group{height:1px;padding:8px 0 0;margin:6px 10px;overflow:hidden;background:var(--line-soft);color:transparent}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;color:var(--ink-2);
  border-left:2px solid transparent;font-size:12.5px;text-align:left
}
.navitem svg{flex:none;opacity:.85}
.navitem:hover{background:var(--raise);color:var(--ink)}
.navitem.on{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent)}
.navitem .tag{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--raise);color:var(--ink-3)}
.navitem.on .tag{background:rgba(0,0,0,.2)}
.navitem .tag.crit{background:rgba(207,84,80,.2);color:var(--crit)}
.shell.collapsed .navitem span,.shell.collapsed .navitem .tag{display:none}
.shell.collapsed .navitem{justify-content:center;padding:9px 0}

/* ---------- views ---------- */
.view{display:none;min-height:0;overflow:hidden}
.view.on{display:block;height:100%}
.scroll{height:100%;overflow-y:auto;padding:18px 22px 40px}
.vhead{display:flex;align-items:baseline;gap:14px;margin:0 0 4px}
.vhead h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.1px}
.vhead p{margin:0;color:var(--ink-3);font-size:12.5px}
.sub{color:var(--ink-3);font-size:12px;margin:0 0 16px}

.slab{background:var(--panel);border:1px solid var(--line);border-radius:5px}
.slab>header{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:500;color:var(--ink-2)
}
.slab>header .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.slab .body{padding:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.g4,.g3,.g2{grid-template-columns:1fr}}

.stat{display:flex;flex-direction:column;gap:2px;padding:11px 13px}
.stat .k{color:var(--ink-3);font-size:11px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.4px}
.stat .d{font-size:11px;color:var(--ink-3)}

table.data{width:100%;border-collapse:collapse;font-size:12.2px}
table.data th{
  text-align:left;font-weight:500;color:var(--ink-3);font-size:11px;padding:6px 10px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)
}
table.data td{padding:7px 10px;border-bottom:1px solid var(--line-soft)}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--raise)}
table.data td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.clickrow{cursor:pointer}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;font-size:11px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.pass{color:var(--pass);background:rgba(79,157,116,.12);border-color:rgba(79,157,116,.3)}
.pill.warn{color:var(--warn);background:rgba(214,139,50,.12);border-color:rgba(214,139,50,.3)}
.pill.crit{color:var(--crit);background:rgba(207,84,80,.12);border-color:rgba(207,84,80,.3)}
.pill.info{color:var(--info);background:rgba(95,146,173,.12);border-color:rgba(95,146,173,.3)}
.pill.idle{color:var(--ink-3);background:var(--raise);border-color:var(--line)}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:4px;background:var(--raise);color:var(--ink);font-size:12.2px
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent-line);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
@media(max-width:900px){.qa{grid-template-columns:repeat(2,1fr)}}
.qa button{display:flex;flex-direction:column;gap:3px;padding:13px 14px;background:var(--panel);text-align:left}
.qa button:hover{background:var(--raise)}
.qa b{font-weight:500;font-size:12.5px}
.qa i{font-style:normal;color:var(--ink-3);font-size:11.5px}

/* ---------- workspace ---------- */
.ws{
  height:100%;display:grid;
  grid-template-columns:var(--lw) 5px minmax(0,1fr) 5px var(--rw);
  grid-template-rows:minmax(0,1fr) 5px var(--bh);
  grid-template-areas:"tree v1 vp v2 props" "tree v1 h v2 props" "tree v1 dock v2 props";
  background:var(--line-soft)
}
.ws .tree{grid-area:tree}
.ws .vp{grid-area:vp}
.ws .dock{grid-area:dock}
.ws .props{grid-area:props}
.split{background:var(--bg);position:relative}
.split:hover,.split.drag{background:var(--accent)}
.split.v{grid-row:1/4;cursor:col-resize}
.split.v.a{grid-area:v1}
.split.v.b{grid-column:4;grid-row:1/4}
.split.h{grid-area:h;cursor:row-resize}
.pane{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.pane>header{
  display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;flex:none;
  border-bottom:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--ink-2)
}
.pane>header .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.pane .fill{flex:1;min-height:0;overflow:auto}

.tabs{display:flex;gap:1px;overflow-x:auto;flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{padding:6px 11px;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}

/* tree */
.node{display:flex;align-items:center;gap:6px;padding:3.5px 10px;font-size:12.2px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.node:hover{background:var(--raise);color:var(--ink)}
.node.on{background:var(--accent-soft);color:var(--ink)}
.node .tw{width:12px;flex:none;color:var(--ink-3);font-family:var(--mono);font-size:10px}
.node .ic{flex:none;opacity:.8}
.node .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.kids{display:none}
.kids.open{display:block}

/* viewport */
.vpwrap{position:relative;flex:1;min-height:0;background:#0a0f13}
:root[data-theme="light"] .vpwrap{background:#dfe6eb}
#gl{display:block;width:100%;height:100%}
.vptools{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.vptool{
  width:30px;height:28px;display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(18,26,32,.88);color:var(--ink-2);border-radius:4px;backdrop-filter:blur(4px)
}
:root[data-theme="light"] .vptool{background:rgba(255,255,255,.9)}
.vptool:hover{color:var(--ink);border-color:var(--ink-3)}
.vptool.on{background:var(--accent);border-color:var(--accent-line);color:#fff}
.legend{
  position:absolute;right:10px;top:10px;width:132px;padding:8px;border:1px solid var(--line);
  border-radius:4px;background:rgba(18,26,32,.9);backdrop-filter:blur(4px);font-size:10.5px
}
:root[data-theme="light"] .legend{background:rgba(255,255,255,.93)}
.legend .lt{font-size:11px;color:var(--ink);margin-bottom:1px}
.legend .lu{font-family:var(--mono);color:var(--ink-3);margin-bottom:6px}
.legend .bar{display:flex;gap:6px}
.legend canvas{width:16px;height:132px;border:1px solid var(--line);border-radius:2px;display:block}
.legend .ticks{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);color:var(--ink-2)}
.legend .ft{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--ink-3);font-family:var(--mono);line-height:1.6}
.vpfoot{
  position:absolute;left:8px;bottom:8px;right:8px;display:flex;align-items:center;gap:10px;
  padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:rgba(18,26,32,.9);
  backdrop-filter:blur(4px);font-family:var(--mono);font-size:10.5px;color:var(--ink-2)
}
:root[data-theme="light"] .vpfoot{background:rgba(255,255,255,.92)}
.vpfoot input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.probe-tip{position:absolute;pointer-events:none;padding:5px 7px;border:1px solid var(--accent-line);background:rgba(18,26,32,.95);border-radius:3px;font-family:var(--mono);font-size:10.5px;display:none;z-index:5;line-height:1.5}
:root[data-theme="light"] .probe-tip{background:rgba(255,255,255,.97)}
.demo-flag{
  position:absolute;right:10px;bottom:46px;font-size:10px;font-family:var(--mono);color:var(--ink-3);
  border:1px dashed var(--line);padding:2px 6px;border-radius:3px;background:rgba(18,26,32,.7)
}

/* property rows */
.prow{display:flex;gap:8px;padding:5px 10px;font-size:12px;border-bottom:1px solid var(--line-soft);align-items:center}
.prow .k{color:var(--ink-3);flex:1;min-width:0}
.prow .v{font-family:var(--mono);text-align:right;color:var(--ink)}
.psec{padding:7px 10px 4px;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);background:var(--surface);border-bottom:1px solid var(--line-soft);border-top:1px solid var(--line-soft)}
.ctl{padding:8px 10px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line-soft)}
.ctl label{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.ctl label b{font-family:var(--mono);font-weight:400;color:var(--ink-2)}
select,input[type=text],input[type=number],textarea{
  width:100%;padding:5px 7px;background:var(--raise);border:1px solid var(--line);
  border-radius:3px;font-size:12px
}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:4px 10px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.varlist{display:flex;flex-direction:column}
.varlist button{display:flex;gap:8px;align-items:center;padding:5px 10px;font-size:12px;color:var(--ink-2);text-align:left;border-left:2px solid transparent}
.varlist button:hover{background:var(--raise);color:var(--ink)}
.varlist button.on{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent)}
.varlist button .u{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}

/* dock */
.logline{display:flex;gap:9px;padding:2.5px 10px;font-family:var(--mono);font-size:11px;border-bottom:1px solid var(--line-soft)}
.logline .t{color:var(--ink-3);flex:none}
.logline .lv{flex:none;width:52px}
.lv.INFO{color:var(--info)} .lv.WARN{color:var(--warn)} .lv.ERROR{color:var(--crit)} .lv.OK{color:var(--pass)}
.plotwrap{padding:10px;display:grid;gap:12px}
svg.plot{width:100%;display:block;background:transparent}
svg.plot .ax{stroke:var(--line);stroke-width:1}
svg.plot .gl{stroke:var(--line-soft);stroke-width:1}
svg.plot text{fill:var(--ink-3);font-family:var(--mono);font-size:9px}
svg.plot .ttl{fill:var(--ink-2);font-family:var(--sans);font-size:10.5px}

/* findings */
.finding{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden}
.finding>.fh{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.finding>.fh .ttl{font-weight:500;font-size:12.5px}
.finding>.fh .loc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.finding .fb{display:none;padding:0 12px 12px;border-top:1px solid var(--line-soft)}
.finding.open .fb{display:block}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:12.2px;margin-top:10px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.evidence{margin-top:10px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.evidence .eh{padding:5px 10px;background:var(--surface);font-size:10.5px;color:var(--ink-3);font-family:var(--mono);border-bottom:1px solid var(--line)}

/* assistant */
.chat{display:grid;grid-template-rows:1fr auto;height:100%}
.msgs{overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:820px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent-line);padding:8px 12px;border-radius:5px;font-size:12.8px}
.ans{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden}
.ans>.ah{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.block{padding:10px 12px;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:118px 1fr;gap:12px;font-size:12.6px}
.block:last-child{border-bottom:none}
.block .lbl{font-size:10.5px;font-family:var(--mono);padding-top:2px}
.block .lbl.data{color:var(--info)} .block .lbl.calc{color:var(--accent)}
.block .lbl.rule{color:var(--pass)} .block .lbl.interp{color:var(--warn)} .block .lbl.rec{color:var(--ink-2)}
.block .lbl::before{content:"";display:inline-block;width:6px;height:6px;border-radius:1px;background:currentColor;margin-right:6px;vertical-align:1px}
@media(max-width:760px){.block{grid-template-columns:1fr}}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 22px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:12px;font-size:11.5px;color:var(--ink-2);background:var(--panel)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1}

/* formula */
.calc{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.calc .ch{padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:center}
.formula{padding:12px;background:var(--surface);font-family:var(--mono);font-size:13.5px;text-align:center;border-bottom:1px solid var(--line);color:var(--ink)}
.calc .ins{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;font-size:12px}
.calc .ins div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.calc .ins span:last-child{font-family:var(--mono)}
.calc .res{padding:9px 12px;background:var(--raise);display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line)}
.calc .res b{font-family:var(--mono);font-size:16px;font-weight:500}
.assump{padding:9px 12px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line-soft)}

/* comparison */
.cmp-heads{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dualvp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden;height:330px}
.dualvp>div{position:relative;background:#0a0f13}
:root[data-theme="light"] .dualvp>div{background:#dfe6eb}
.dualvp canvas{display:block;width:100%;height:100%}
.dualvp .tagv{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:3px;background:rgba(18,26,32,.85)}
.bardiff{display:flex;align-items:center;gap:8px}
.bardiff .track{flex:1;height:6px;background:var(--raise);border-radius:3px;overflow:hidden;position:relative}
.bardiff .track i{position:absolute;top:0;bottom:0;background:var(--accent);display:block}
.bardiff .track i.down{background:var(--pass)} .bardiff .track i.up{background:var(--crit)}

/* report */
.rep{display:grid;grid-template-columns:270px 1fr;gap:14px;height:100%;min-height:0}
@media(max-width:900px){.rep{grid-template-columns:1fr}}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:auto;padding:30px 36px}
.doc h2{font-size:15px;margin:0 0 3px} .doc h3{font-size:12.5px;margin:20px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc p{font-size:12.3px;color:var(--ink-2);margin:0 0 8px;max-width:72ch}
.doc .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:16px}
.secpick{display:flex;flex-direction:column;overflow:auto}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);padding:8px 14px;border-radius:4px;
  background:var(--raise);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.3px;z-index:60;
  opacity:0;transition:opacity .18s
}
.toast.on{opacity:1}
.status{
  display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--surface);
  border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-3)
}
.status .r{margin-left:auto;display:flex;gap:14px}
.sep{width:1px;height:14px;background:var(--line)}
.empty{padding:40px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-2);font-weight:500;margin-bottom:5px;font-size:13px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      const n=g.attributes.position.count;

      g.userData.base=Float32Array.from(g.attributes.position.array);
      const m=new T.MeshStandardMaterial({vertexColors:true,metalness:.08,roughness:.72,side:T.DoubleSide,
        clippingPlanes:[],flatShading:false});
      const mesh=new T.Mesh(g,m);
      mesh.position.set(...(pd.pos||[0,0,0]));
      if(pd.rot)mesh.rotation.set(...pd.rot);
      const rec={name:pd.n,mesh,mat:m,fixed:!!pd.fixed,anim:pd.anim,amp:pd.amp||0,
        pivot:pd.pivot,pos:(pd.pos||[0,0,0]).slice(),visible:true,geo:g};
      if(pd.pivot){ // shift geometry so the pivot sits at the mesh origin
        const off=[pd.pos[0]-pd.pivot[0],pd.pos[1]-pd.pivot[1],pd.pos[2]-pd.pivot[2]];
        g.translate(off[0],off[1],off[2]); g.userData.base=Float32Array.from(g.attributes.position.array);
        mesh.position.set(...pd.pivot);
      }
      this.parts.push(rec); this.group.add(mesh);
    });
    this.box=new T.Box3().setFromObject(this.group);
    this.box.getCenter(this.target);
    this.radius=this.box.getSize(new T.Vector3()).length()/2;
    this.sph.r=this.radius*2.6;
    this.edgesOn(this.state.edges);
  }
  edgesOn(on){
    this.state.edges=on;
    this.parts.forEach(p=>{
      if(p.edge){p.mesh.remove(p.edge); p.edge.geometry.dispose(); p.edge=null;}
      if(on&&!p.fixed){
        const e=new T.LineSegments(new T.EdgesGeometry(p.geo,32),
          new T.LineBasicMaterial({color:0x0b1116,transparent:true,opacity:.28}));
        p.mesh.add(e); p.edge=e;
      }
    });
  }
  paint(vr){
    this.vr=vr||this.vr; const v=this.vr; if(!v)return;
    const t=this.state.t, key=this.geomKey, dfn=DEFORM[key];
    const rng=this.state.range||[0,1];
    this.parts.forEach(p=>{
      const g=p.geo, pos=g.attributes.position, col=g.attributes.color, base=g.userData.base;
      const o=p.pivot?p.pivot:p.pos;
      for(let i=0;i<pos.count;i++){
        const bx=base[i*3],by=base[i*3+1],bz=base[i*3+2];
        const wx=bx+o[0], wy=by+o[1], wz=bz+o[2];
        let f=p.fixed?0:v.f(wx,wy,wz,t); f=Math.max(0,Math.min(1,f));
        let n=(f-rng[0])/((rng[1]-rng[0])||1); n=Math.max(0,Math.min(1,n));
        let c;
        if(p.fixed){c=[92,104,114];}
        else c=cmap(this.state.cmap,n);
        col.array[i*3]=c[0]/255; col.array[i*3+1]=c[1]/255; col.array[i*3+2]=c[2]/255;
        if(this.state.deform>0&&!p.fixed){
          const d=dfn(wx,wy,wz,f), s=this.state.deform;
          pos.array[i*3]=bx+d[0]*s; pos.array[i*3+1]=by+d[1]*s; pos.array[i*3+2]=bz+d[2]*s;
        }else{pos.array[i*3]=bx;pos.array[i*3+1]=by;pos.array[i*3+2]=bz;}
      }
      col.needsUpdate=true; pos.needsUpdate=true; g.computeVertexNormals();
    });
    this.applyStyle(); this.animParts();
  }
  animParts(){
    const t=this.state.t;
    this.parts.forEach(p=>{
      if(p.anim==='arm')p.mesh.rotation.z=Math.sin(t*6.283)*p.amp;
      if(p.anim==='knuckle')p.mesh.position.y=p.pos[1]+Math.sin(t*6.283)*p.amp;
      if(p.anim==='damper')p.mesh.scale.y=1-Math.sin(t*6.283)*.12;
    });
  }
  applyStyle(){
    const s=this.state;
    this.plane.normal.set(s.axis==='x'?-1:0,s.axis==='y'?-1:0,s.axis==='z'?-1:0);
    const ext=s.axis==='x'?[this.box.min.x,this.box.max.x]:s.axis==='y'?[this.box.min.y,this.box.max.y]:[this.box.min.z,this.box.max.z];
    this.plane.constant=ext[0]+(ext[1]-ext[0])*s.clipPos;
    this.parts.forEach(p=>{
      p.mat.wireframe=s.wire;
      p.mat.transparent=s.transp||p.fixed;
      p.mat.opacity=p.fixed?(s.transp?.12:.3):(s.transp?.42:1);
      p.mat.clippingPlanes=s.clip?[this.plane]:[];
      p.mat.needsUpdate=true;
      p.mesh.visible=p.visible;
      if(p.edge)p.edge.visible=s.edges&&!s.wire&&p.visible;
    });
  }
  fit(){ if(!this.box)return; this.box.getCenter(this.target); this.sph.r=this.radius*2.6; }
  view(name){
    const v={iso:[.9,1.05],front:[0,1.5708],top:[0,.01],right:[1.5708,1.5708],left:[-1.5708,1.5708]}[name]||[.9,1.05];
    this.sph.th=v[0]; this.sph.ph=v[1];
  }
  resize(){
    const r=(this.c.parentElement||this.c).getBoundingClientRect();
    if(!r.width||!r.height)return;
    this.renderer.setSize(r.width,r.height,false);
    this.cam.aspect=r.width/r.height; this.cam.updateProjectionMatrix();
  }
  addProbe(pt,val,unit){
    const g=new T.SphereGeometry(this.radius*.018,12,10);
    const m=new T.MeshBasicMaterial({color:0xffffff});
    const s=new T.Mesh(g,m); s.position.copy(pt); this.scene.add(s);
    this.probes.push({mesh:s,val,unit,pt});
    return this.probes.length;
  }
  clearProbes(){this.probes.forEach(p=>this.scene.remove(p.mesh)); this.probes=[];}
  _bind(){
    const c=this.c; let drag=null;
    c.addEventListener('pointerdown',e=>{
      c.setPointerCapture(e.pointerId);
      drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey,moved:0};
    });
    c.addEventListener('contextmenu',e=>e.preventDefault());
    c.addEventListener('pointermove',e=>{
      if(this.opts.onHover)this.opts.onHover(e,this);
      if(!drag)return;
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
      drag.moved+=Math.abs(dx)+Math.abs(dy);
      if(drag.pan){
        const f=this.sph.r*.0018;
        const right=new T.Vector3().setFromMatrixColumn(this.cam.matrix,0);
        const up=new T.Vector3().setFromMatrixColumn(this.cam.matrix,1);
        this.target.addScaledVector(right,-dx*f).addScaledVector(up,dy*f);
      }else{
        this.sph.th-=dx*.008; this.sph.ph=Math.max(.05,Math.min(Math.PI-.05,this.sph.ph-dy*.008));
      }
    });
    c.addEventListener('pointerup',e=>{
      if(drag&&drag.moved<4&&this.opts.onClick)this.opts.onClick(e,this);
      drag=null;
    });
    c.addEventListener('wheel',e=>{e.preventDefault(); this.sph.r*=(1+Math.sign(e.deltaY)*.11);
      this.sph.r=Math.max(this.radius*.35,Math.min(this.radius*14,this.sph.r));},{passive:false});
  }
  pick(e){
    const r=this.c.getBoundingClientRect();
    const m=new T.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    const rc=new T.Raycaster(); rc.setFromCamera(m,this.cam);
    const hits=rc.intersectObjects(this.parts.filter(p=>p.visible&&!p.fixed).map(p=>p.mesh),false);
    return hits[0]||null;
  }
  valueAt(pt){
    if(!this.vr)return null;
    const f=Math.max(0,Math.min(1,this.vr.f(pt.x,pt.y,pt.z,this.state.t)));
    return this.vr.min+(this.vr.max-this.vr.min)*f;
  }
  _loop(){
    const step=()=>{
      if(this.dead)return;
      requestAnimationFrame(step);
      const s=this.sph;
      this.cam.position.set(
        this.target.x+s.r*Math.sin(s.ph)*Math.sin(s.th),
        this.target.y+s.r*Math.cos(s.ph),
        this.target.z+s.r*Math.sin(s.ph)*Math.cos(s.th));
      this.cam.lookAt(this.target);
      this.renderer.render(this.scene,this.cam);
    };
    step();
  }
}

/* ---------- small SVG plotting ---------- */
function plot(p,h){
  h=h||150; const W=560,H=h,L=46,R=12,Tp=20,B=26;
  const all=p.s.flatMap(s=>s.d);
  const xs=all.map(d=>d[0]), ys=all.map(d=>d[1]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=(y1-y0)*.12||1; y0-=pad; y1+=pad;
  const X=v=>L+(v-x0)/((x1-x0)||1)*(W-L-R), Y=v=>Tp+(1-(v-y0)/((y1-y0)||1))*(H-Tp-B);
  const cols=['var(--accent)','var(--warn)','var(--pass)','var(--crit)'];
  let g='';
  for(let i=0;i<=4;i++){const yy=Tp+i*(H-Tp-B)/4, val=y1-(y1-y0)*i/4;
    g+=`<line class="gl" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${U.n(val,Math.abs(val)<10?2:0)}</text>`;}
  for(let i=0;i<=4;i++){const xx=L+i*(W-L-R)/4, val=x0+(x1-x0)*i/4;
    g+=`<text x="${xx}" y="${H-9}" text-anchor="middle">${U.n(val,Math.abs(val)<10?1:0)}</text>`;}
  const lines=p.s.map((s,i)=>{
    const d=s.d.map((pt,j)=>(j?'L':'M')+X(pt[0]).toFixed(1)+' '+Y(pt[1]).toFixed(1)).join(' ');
    return `<path d="${d}" fill="none" stroke="${cols[i%4]}" stroke-width="1.6"/>`+
      s.d.map(pt=>`<circle cx="${X(pt[0]).toFixed(1)}" cy="${Y(pt[1]).toFixed(1)}" r="2" fill="${cols[i%4]}"/>`).join('');
  }).join('');
  const leg=p.s.map((s,i)=>`<g transform="translate(${L+i*112},${Tp-8})"><rect width="9" height="2.5" y="-3" fill="${cols[i%4]}"/><text x="13" y="0">${s.n}</text></g>`).join('');
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
   <text class="ttl" x="${L-40}" y="11">${p.t}</text>
   <line class="ax" x1="${L}" y1="${Tp}" x2="${L}" y2="${H-B}"/><line class="ax" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>
   ${g}${lines}${leg}
   <text x="${W-R}" y="${H-9}" text-anchor="end">${p.x}</text>
   <text x="${L-40}" y="${H-B+12}">${p.y}</text></svg>`;
}
</script>

 FEA:[{n:'Stress',v:['vonmises','s1']},{n:'Strain',v:['strain']},{n:'Displacement',v:['disp']},

 CFD:[{n:'Contours',v:['pressure','velocity','cp','temperature']},{n:'Vectors',v:['velocity'],overlay:'vectors'},

function mountWorkspace(host){
  if(!wsEl)buildWorkspace();
  if(wsEl.parentElement!==host){host.innerHTML=''; host.appendChild(wsEl);}
  if(!VIEWER){
    VIEWER=new Viewer(U.q('#gl'),{
      onClick:(e,v)=>{

        tip.innerHTML=`${U.n(val,3)} ${v.vr.unit}<br><span style="color:var(--ink-3)">${h.point.x.toFixed(1)}, ${h.point.y.toFixed(1)}, ${h.point.z.toFixed(1)}</span>`;
        U.q('#cursorVal').textContent=U.n(val,3)+' '+v.vr.unit;
      }
    });
    wireWorkspaceChrome();
  }

}
function curVar(){const p=P(ST.proj); return VARS[p.geom].find(v=>v.id===ST.varId)||VARS[p.geom][0];}
function loadWorkspace(){
  const p=P(ST.proj);
  VIEWER.load(p.geom,VARS[p.geom]);

}
function applyTab(i,force){
  const p=P(ST.proj), tabs=TABS[p.domain]; ST.tab=Math.min(i,tabs.length-1);
  const tb=tabs[ST.tab];
  if(force||!tb.v.includes(ST.varId))ST.varId=tb.v[0];
  VIEWER.state.deform=tb.deform||0;
  VIEWER.state.clip=!!tb.clip; VIEWER.state.range=null; ST.mode=tb.overlay||null;
  overlay(tb.overlay);
  refreshAll();
}
function refreshAll(){
  const p=P(ST.proj), v=curVar();
  VIEWER.state.cmap=v.cm; VIEWER.paint(v);
  renderTabs(); renderTree(); renderProps(); renderDock(); renderLegend();
  U.q('#stUnits').textContent='Units: '+(p.domain==='CFD'?'m · kg · s · Pa':p.domain==='Thermal'?'mm · W · K':'mm · kg · N · s · MPa');
}
function renderTabs(){
  const p=P(ST.proj), host=U.q('#wsTabs');
  host.innerHTML=TABS[p.domain].map((t,i)=>`<button class="${i===ST.tab?'on':''}" data-tab="${i}">${t.n}</button>`).join('');
  U.qa('[data-tab]',host).forEach(b=>b.onclick=()=>applyTab(+b.dataset.tab,true));
  const dt=U.q('#dockTabs'); U.qa('button',dt).forEach(b=>b.classList.toggle('on',b.dataset.dock===ST.dock));
  const pt=U.q('#propTabs'); U.qa('button',pt).forEach(b=>b.classList.toggle('on',b.dataset.rt===ST.rtab));
}
function renderLegend(){
  const v=curVar(), l=U.q('#legend'), rng=VIEWER.state.range||[0,1];
  const lo=v.min+(v.max-v.min)*rng[0], hi=v.min+(v.max-v.min)*rng[1];
  const cv=document.createElement('canvas'); cv.width=16; cv.height=132;
  const ctx=cv.getContext('2d');
  for(let y=0;y<132;y++){const c=cmap(VIEWER.state.cmap,1-y/131);
    ctx.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; ctx.fillRect(0,y,16,1);}
  const ticks=[0,1,2,3,4,5,6].map(i=>U.n(hi-(hi-lo)*i/6,Math.abs(hi)<10?3:1)).map(t=>`<span>${t}</span>`).join('');
  l.innerHTML=`<div class="lt">${v.label}</div><div class="lu">[${v.unit}]</div>
   <div class="bar">${cv.outerHTML}<div class="ticks">${ticks}</div></div>
   <div class="ft">max ${U.n(v.max,3)}<br>min ${U.n(v.min,3)}<br>${VIEWER.state.cmap} · ${(rng[1]-rng[0]===1)?'full range':'filtered'}</div>`;
  l.querySelector('canvas').getContext('2d').drawImage(cv,0,0);
  const c2=l.querySelector('canvas').getContext('2d');
  for(let y=0;y<132;y++){const c=cmap(VIEWER.state.cmap,1-y/131);
    c2.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; c2.fillRect(0,y,16,1);}
}
function overlay(kind){
  if(VIEWER.ov){VIEWER.scene.remove(VIEWER.ov); VIEWER.ov=null;}
  if(!kind||VIEWER.geomKey!=='carbody')return;
  const g=new T.Group();
  if(kind==='streamlines'){
    for(let i=0;i<26;i++){
      const y0=.25+ (i%13)*.085, z=(i<13?-1:1)*(.15+(i%13)*.06), pts=[];
      for(let x=-3.4;x<3.6;x+=.12){
        const near=Math.exp(-(x*x)/2.2);
        pts.push(new T.Vector3(-x,y0+near*.42*(y0>.55?1:.25)+Math.sin(x*2+i)*.02*near,z*(1+near*.35)));
      }
      const geo=new T.BufferGeometry().setFromPoints(pts);
      const col=cmap('jet',.3+.5*Math.exp(-((y0-.9)**2)/.2));
      g.add(new T.Line(geo,new T.LineBasicMaterial({color:new T.Color(col[0]/255,col[1]/255,col[2]/255),transparent:true,opacity:.85})));
    }
  }
  if(kind==='vectors'){
    for(let x=-3;x<=3.2;x+=.42)for(let y=.25;y<=1.6;y+=.22){
      const near=Math.exp(-((x)*(x))/2.2)*Math.exp(-((y-.7)**2)/.9);
      const sp=.35+.65*(1-near);
      const c=cmap('jet',sp);
      const ar=new T.ArrowHelper(new T.Vector3(-1,near*.25,0).normalize(),new T.Vector3(x,y,0),
        .16+sp*.16,new T.Color(c[0]/255,c[1]/255,c[2]/255),.06,.04);
      g.add(ar);
    }
  }
  VIEWER.ov=g; VIEWER.scene.add(g);
}

function stats(){
  const v=curVar(); let vals=[];
  VIEWER.parts.filter(p=>!p.fixed&&p.visible).forEach(p=>{
    const b=p.geo.userData.base, o=p.pivot||p.pos;
    for(let i=0;i<b.length;i+=3){
      const f=Math.max(0,Math.min(1,v.f(b[i]+o[0],b[i+1]+o[1],b[i+2]+o[2],VIEWER.state.t)));
      vals.push(v.min+(v.max-v.min)*f);
    }
  });
  vals.sort((a,b)=>a-b);
  const n=vals.length, mean=vals.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/n);
  const q=f=>vals[Math.min(n-1,Math.floor(f*n))];
  const bins=new Array(24).fill(0);
  vals.forEach(x=>{const i=Math.min(23,Math.floor((x-vals[0])/((vals[n-1]-vals[0])||1)*24)); bins[i]++;});
  return {n,min:vals[0],max:vals[n-1],mean,sd,p50:q(.5),p95:q(.95),p99:q(.99),bins};
}

      findingHTML(d).replace('<span class="ttl">',`<span class="ttl"><span class="num" style="color:var(--ink-3);font-size:11px;margin-right:8px">${d.p.id}</span>`)).join('');
    wireFindings(list);
  };
  draw('all');
  U.qa('[data-sev]',v).forEach(b=>b.onclick=()=>{
    U.qa('[data-sev]',v).forEach(x=>x.classList.remove('primary')); b.classList.add('primary'); draw(b.dataset.sev);
  });
};

RENDER.assistant=()=>{
  const v=U.q('#v-assistant');

  v.innerHTML=`<div class="chat">

     <div class="ans"><div class="ah">assistant · context: all loaded projects</div>
      <div class="block"><span class="lbl data">${LBL.data}</span><span>Four projects are loaded with 24 result variables between them. I answer from the stored result data, from quantities I can derive from it, and from standard engineering practice — and I label which is which on every answer.</span></div>

   <div class="composer">
     <div class="chips">${['Where is maximum stress?','Show regions above 80% of yield strength','Why might this CFD case have poor convergence?','Compare these simulations','Explain this pressure drop','Generate a technical summary','Is the bracket safe?'].map(c=>`<button class="chip">${c}</button>`).join('')}</div>

      ${hit.act&&hit.act.length?`<div class="block"><span class="lbl rec">Next step</span><span>${hit.act.map(a=>`<button class="btn sm" data-ai="${a[1]}" style="margin-right:6px">${a[0]}</button>`).join('')}</span></div>`:''}
    </div>`;

      } else {if(hit.proj)ST.proj=hit.proj; go(t);}

  U.q('#aiIn',v).onkeydown=e=>{if(e.key==='Enter'){ask(e.target.value); e.target.value='';}};
};

             [4,5.0,3.5,'—',198.2,1.908,1.39],[5,6.0,3.5,'—',186.9,1.980,1.48],[6,7.0,3.5,'—',172.4,2.052,1.60],

     <div class="slab"><header>Trade-off: mass against peak stress</header>
       <div style="padding:10px"><svg class="plot" viewBox="0 0 ${W} ${H}">
        <line class="ax" x1="50" y1="${H-32}" x2="${W-20}" y2="${H-32}"/><line class="ax" x1="50" y1="14" x2="50" y2="${H-32}"/>
        ${pareto.map((p,i)=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4.5" fill="${i===2?'var(--accent)':'var(--info)'}"/>

        <p class="hint" style="padding:0 2px">DP3 is the variant carried into the comparison view. Points are sample data, not a solved optimisation.</p></div></div>
   </div>
   <div class="grid g2">
     <div class="slab"><header>Sensitivity of peak stress to each input</header>
       <div class="body" style="display:grid;gap:9px">
       ${sens.map(s=>{const w=Math.abs(s[1])*100;
         return `<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${s[0]}</span>
           <span class="num" style="color:var(--ink-3)">${s[1]>0?'+':''}${s[1].toFixed(2)}</span></div>
           <div class="bardiff"><div class="track"><i class="${s[1]>0?'up':'down'}" style="left:${s[1]>0?50:50-w/2}%;width:${w/2}%"></i></div></div></div>`;}).join('')}
       <p class="hint">Standardised regression coefficients over the 8 design points. Magnitude ranks the inputs; sign shows the direction of the effect on peak stress.</p>

     <div class="slab"><header>Surrogate model</header>

<script>
/* ---------------- REPORTS ---------------- */
const SECTIONS=['Project','Simulation','Solver','Mesh','Materials','Boundary conditions','Loads','Convergence','Results',
 'Calculations','Validation','Diagnostics','Comparison','AI interpretation','Conclusions','Appendix'];
let PICK=new Set(SECTIONS);
RENDER.reports=()=>{
  const v=U.q('#v-reports'), p=P(ST.proj);
  v.innerHTML=`<div class="scroll" style="display:flex;flex-direction:column;height:100%;padding-bottom:20px">
   <div class="vhead"><h1>Engineering report</h1><p>Assembled from the stored result model — nothing in the document is typed by hand.</p></div>
   <div class="sub">Source project: ${p.name} · ${p.id}</div>
   <div class="rep" style="flex:1;min-height:420px">
    <div class="slab secpick"><header>Sections<span class="r"><button class="btn sm" id="allSec">All</button><button class="btn sm" id="noSec">None</button></span></header>
      <div class="fill" style="overflow:auto">
      ${SECTIONS.map(s=>`<label class="chk"><input type="checkbox" data-sec="${s}" ${PICK.has(s)?'checked':''}> ${s}</label>`).join('')}
      </div>
      <div style="padding:10px;border-top:1px solid var(--line);display:grid;gap:7px">
        <div style="display:flex;gap:7px;flex-wrap:wrap">${PROJECTS.map(x=>`<button class="btn sm ${x.id===ST.proj?'primary':''}" data-rp="${x.id}">${x.id}</button>`).join('')}</div>
        <button class="btn primary" id="expPdf">Export as PDF</button>
        <button class="btn" id="expHtml">Export as HTML</button>
      </div></div>
    <div class="doc" id="doc"></div>
   </div></div>`;
  const doc=U.q('#doc',v);
  const build=()=>{
    const has=s=>PICK.has(s);
    const t=[];
    t.push(`<h2>${p.name} — engineering report</h2>
      <div class="meta">${p.id} · ${p.domain} · ${p.type} · issued ${new Date().toISOString().slice(0,10)} · ${p.owner}</div>
      <p style="border-left:2px solid var(--warn);padding-left:10px">All values in this document are simulated sample data from a demonstration build and are not suitable for design release.</p>`);
    if(has('Project'))t.push(`<h3>1 Project</h3><p>${p.name} is analysed as ${p.type.toLowerCase()}. The result model was imported from ${p.file} (${p.size}) and holds ${VARS[p.geom].length} result variables across ${p.cases.length} defined cases.</p>`);
    if(has('Simulation'))t.push(`<h3>2 Simulation</h3><p>Cases defined: ${p.cases.join('; ')}. Results are attached to the first case; the remaining cases are defined but not imported.</p>`);
    if(has('Solver'))t.push(`<h3>3 Solver</h3><p>${p.solver}, wall time ${p.wall}, run ${p.run}.</p>`);
    if(has('Mesh'))t.push(`<h3>4 Mesh</h3>${tbl(Object.entries(p.mesh))}`);
    if(has('Materials'))t.push(`<h3>5 Materials</h3>${tbl(p.materials.map(m=>[m.n,m.p]))}`);
    if(has('Boundary conditions'))t.push(`<h3>6 Boundary conditions</h3>${tbl(p.bcs.map(m=>[m.n,m.p]))}`);
    if(has('Loads'))t.push(`<h3>7 Loads</h3>${tbl(p.loads.map(m=>[m.n,m.p]))}`);
    if(has('Convergence'))t.push(`<h3>8 Convergence</h3><p>${p.valid.filter(c=>/converg|balance|integrator/i.test(c.n)).map(c=>c.m).join(' ')||'Convergence evidence is recorded in the validation section.'}</p>`);
    if(has('Results'))t.push(`<h3>9 Results</h3>${tbl(p.keyvals)}<p>Peak locations and node identifiers for each variable are held in the result model and reproduced in the appendix.</p>`);
    if(has('Calculations'))t.push(`<h3>10 Engineering calculations</h3>`+p.calcs.map(c=>
      `<p><b style="color:var(--ink)">${c.n}</b><br><span class="num">${c.f}</span><br>${c.i.map(i=>i[0]+' = '+i[1]).join(' · ')}<br>Result: <b class="num" style="color:var(--ink)">${c.r} ${c.u}</b><br><i>Assumptions: ${c.a}</i></p>`).join(''));
    if(has('Validation'))t.push(`<h3>11 Validation</h3>${tbl(p.valid.map(c=>[c.n+' — '+STATUS_LABEL[c.s],c.m]))}`);
    if(has('Diagnostics'))t.push(`<h3>12 Diagnostics</h3>`+p.diag.map(d=>`<p><b style="color:var(--ink)">${d.t}</b> (${d.sev==='crit'?'critical':d.sev==='warn'?'warning':'information'}) — ${d.loc}.<br>Evidence: ${d.ev.map(e=>e[0]+' '+e[1]).join('; ')}.<br>Possible cause: ${d.cause}<br>Recommended investigation: ${d.action}</p>`).join(''));
    if(has('Comparison')&&COMPARE[p.id])t.push(`<h3>13 Comparison</h3><p>${COMPARE[p.id].a} against ${COMPARE[p.id].b}.</p>${tbl(COMPARE[p.id].rows.map(r=>[r[0]+' ['+r[1]+']','A '+r[2]+' → B '+r[3]+'  ('+((r[3]-r[2])/Math.abs(r[2])*100).toFixed(1)+' %)']))}`);
    if(has('AI interpretation'))t.push(`<h3>14 Interpretation</h3><p>Interpretation is separated from measured and derived values. ${p.status==='crit'?'This case breaches a stated design limit and the breach governs the next iteration.':p.status==='warn'?'This case meets its primary targets but carries open warnings that limit how firmly the numbers can be quoted.':'This case meets its primary targets, with the open items recorded in diagnostics.'}</p>`);
    if(has('Conclusions'))t.push(`<h3>15 Conclusions</h3><p>${p.keyvals.map(k=>k[0]+' is '+k[1]).join('. ')}. Overall validation state: ${STATUS_LABEL[p.status]}. Outstanding actions are listed against each diagnostic finding.</p>`);
    if(has('Appendix'))t.push(`<h3>16 Appendix</h3>${tbl(VARS[p.geom].map(x=>[x.label+' ['+x.unit+']','min '+U.n(x.min,3)+' · max '+U.n(x.max,3)+(x.node?' · node '+x.node:'')]))}`);
    doc.innerHTML=t.join('');
  };
  const tbl=rows=>`<table class="data" style="margin:6px 0 4px">${rows.map(r=>`<tr><td style="color:var(--ink-3);width:230px">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
  U.qa('[data-sec]',v).forEach(c=>c.onchange=()=>{c.checked?PICK.add(c.dataset.sec):PICK.delete(c.dataset.sec); build();});
  U.q('#allSec',v).onclick=()=>{PICK=new Set(SECTIONS); RENDER.reports();};
  U.q('#noSec',v).onclick=()=>{PICK=new Set(); RENDER.reports();};
  U.qa('[data-rp]',v).forEach(b=>b.onclick=()=>{ST.proj=b.dataset.rp; RENDER.reports();});
  U.q('#expPdf',v).onclick=()=>U.toast('PDF export is not enabled in the demo build — the document above is the rendered report');
  U.q('#expHtml',v).onclick=()=>U.toast('HTML export is not enabled in the demo build');
  build();
};

/* ---------------- DATA & FILES ---------------- */
RENDER.data=()=>{
  const v=U.q('#v-data');
  const schema=[['Mesh topology','nodes, elements, connectivity, element type','all'],
   ['Named sets','node sets, element sets, surfaces, zones','all'],
   ['Unit system','length, mass, time, temperature, derived units','all'],
   ['Steps','load steps, time steps, frequencies, iterations','all'],
   ['Result fields','scalar, vector and tensor fields with location (nodal / elemental / face)','all'],
   ['Provenance','source file, solver version, import timestamp, reader version','all'],
   ['Derived fields','quantities computed by this application, marked as derived','all']];
  v.innerHTML=`<div class="scroll">
   <div class="vhead"><h1>Data and files</h1><p>Imported result files and how they map into the common result model.</p></div>
   <div class="sub">Demo build — files are simulated entries, no data is read from disk.</div>
   <div class="slab" style="margin-bottom:14px"><header>Imported files</header>
    <table class="data"><thead><tr><th>File</th><th>Project</th><th>Solver</th><th>Size</th><th>Imported</th><th>Units resolved</th><th>Parser</th></tr></thead><tbody>
    ${PROJECTS.map(p=>`<tr class="clickrow" data-proj="${p.id}"><td class="num">${p.file}</td><td>${p.name}</td><td>${p.solver}</td>
      <td class="n">${p.size}</td><td class="num" style="font-size:11.5px">${p.run}</td>
      <td><span class="pill pass">consistent</span></td><td><span class="pill pass">mapped</span></td></tr>`).join('')}
    <tr><td class="num" style="color:var(--ink-3)">susp_kc_rig_2026.csv</td><td>Vehicle Suspension — MBD</td><td>Test rig export</td>
      <td class="n">4 MB</td><td class="num" style="font-size:11.5px">—</td><td><span class="pill warn">units not declared</span></td><td><span class="pill idle">not mapped</span></td></tr>
    </tbody></table></div>
   <div class="grid g2">
    <div class="slab"><header>Common result model</header>
     <table class="data"><thead><tr><th>Entity</th><th>Contents</th></tr></thead><tbody>
     ${schema.map(s=>`<tr><td><b style="font-weight:500">${s[0]}</b></td><td style="color:var(--ink-2)">${s[1]}</td></tr>`).join('')}</tbody></table></div>
    <div class="slab"><header>Unit handling</header>
     <table class="data"><tbody>
      ${[['Structural projects','mm · kg · N · s · MPa'],['CFD projects','m · kg · s · Pa · K'],['Thermal projects','mm · W · K'],
         ['Conversion policy','converted on import, original units retained in provenance'],
         ['Mixed-unit detection','flagged as a diagnostic, never silently converted'],
         ['Temperature','stored in K, displayed in °C where configured']]
       .map(r=>`<tr><td style="color:var(--ink-3)">${r[0]}</td><td class="num" style="font-size:11.5px">${r[1]}</td></tr>`).join('')}
     </tbody></table>
     <p class="hint" style="padding:0 12px 12px">One file in this project declares no unit system. It stays unmapped until the units are supplied, rather than being assumed.</p></div>
   </div></div>`;
  wire(v);
};

/* ---------------- calculation sheet in the dock ---------------- */
function renderCalcs(host){
  const p=P(ST.proj);
  host.innerHTML=`<div style="padding:10px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
   ${p.calcs.map(c=>`<div class="calc">
     <div class="ch">${c.n}<span class="pill info" style="margin-left:auto">derived</span></div>
     <div class="formula">${c.f}</div>
     <div class="ins">${c.i.map(i=>`<div><span style="color:var(--ink-3)">${i[0]}</span><span>${i[1]}</span></div>`).join('')}</div>
     <div class="res"><span style="color:var(--ink-3);font-size:11.5px">Result</span><b>${c.r} <span style="font-size:12px;color:var(--ink-2)">${c.u}</span></b></div>
     <div class="assump"><b style="color:var(--ink-2);font-weight:500">Assumptions.</b> ${c.a}</div>
   </div>`).join('')}</div>`;
}
const _renderDock=renderDock;
renderDock=function(){ if(ST.dock==='calculations'){renderCalcs(U.q('#dockBody')); return;} _renderDock(); };

/* ---------------- init ---------------- */
U.q('#stGL').textContent=window.WebGLRenderingContext?'WebGL ready':'WebGL unavailable';
badgeCounts();
go('home');
</script>
