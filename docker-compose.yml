services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CAER_CORS_ORIGINS: http://localhost:8080
      CAER_LOG_LEVEL: INFO
    volumes:
      - caer-data:/srv/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  caer-data:
