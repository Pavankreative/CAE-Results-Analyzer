<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"
     aria-label="CAE Results Analyzer workspace layout">
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #c8d4dd; }
    .t { font-size: 13px; font-weight: 600; fill: #e8eef3; }
    .s { font-size: 11px; fill: #8fa3b0; }
    .m { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; fill: #7f95a3; }
    .panel { fill: #172029; stroke: #2b3946; }
    .accent { fill: none; stroke: #4c82d9; stroke-width: 1.4; }
  </style>
  <rect width="900" height="380" fill="#0e151b"/>
  <rect x="0" y="0" width="900" height="34" fill="#131c24"/>
  <text class="t" x="16" y="22">CAE Results Analyzer</text>
  <text class="s" x="190" y="22">Import result · Projects · Compare · Validation · Generate report</text>
  <text class="m" x="700" y="22">brk-114 · FEA</text>

  <rect class="panel" x="12" y="46" width="120" height="290" rx="3"/>
  <text class="s" x="22" y="66">Navigation</text>
  <text class="m" x="22" y="88">Home</text><text class="m" x="22" y="106">Projects</text>
  <text class="m" x="22" y="124">Simulations</text><text class="m" x="22" y="148">FEA</text>
  <text class="m" x="22" y="166">CFD</text><text class="m" x="22" y="184">Thermal</text>
  <text class="m" x="22" y="202">MBD</text><text class="m" x="22" y="226">Comparison</text>
  <text class="m" x="22" y="244">Validation</text><text class="m" x="22" y="262">Diagnostics</text>
  <text class="m" x="22" y="280">Assistant</text><text class="m" x="22" y="304">Reports</text>
  <text class="m" x="22" y="322">Data &amp; files</text>

  <rect class="panel" x="142" y="46" width="170" height="200" rx="3"/>
  <text class="t" x="154" y="66">Project tree</text>
  <text class="s" x="154" y="88">Geometry · Mesh</text>
  <text class="s" x="154" y="106">Materials · BCs · Loads</text>
  <text class="s" x="154" y="124">Simulation cases</text>
  <text class="s" x="154" y="142">Results by category</text>

  <rect class="panel" x="322" y="46" width="380" height="200" rx="3"/>
  <text class="t" x="334" y="66">3D result viewport</text>
  <path class="accent" d="M420 190 L470 110 L530 150 L590 96 L650 170"/>
  <circle cx="530" cy="150" r="5" fill="#4c82d9"/>
  <text class="s" x="334" y="228">contours · probes · section plane · time steps</text>
  <rect x="664" y="80" width="14" height="110" fill="url(#g)"/>
  <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#00007f"/><stop offset="0.35" stop-color="#00d4ff"/>
    <stop offset="0.6" stop-color="#7cff79"/><stop offset="0.8" stop-color="#ffd400"/>
    <stop offset="1" stop-color="#7f0000"/></linearGradient></defs>

  <rect class="panel" x="712" y="46" width="176" height="290" rx="3"/>
  <text class="t" x="724" y="66">Analysis &amp; properties</text>
  <text class="s" x="724" y="88">Properties · Results</text>
  <text class="s" x="724" y="106">Filters · Controls</text>
  <text class="m" x="724" y="132">max 214.6 MPa</text>
  <text class="m" x="724" y="150">node 2991</text>
  <text class="m" x="724" y="168">FoS = 1.29</text>

  <rect class="panel" x="142" y="256" width="560" height="80" rx="3"/>
  <text class="t" x="154" y="276">Plots · Statistics · Calculations · Diagnostics · Validation</text>
  <path class="accent" d="M160 322 C 240 300, 300 318, 380 296 S 560 292, 690 300"/>
</svg>
